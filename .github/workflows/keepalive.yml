# Keeps the free Render web service awake.
#
# Render free services spin down after 15 minutes without inbound traffic;
# the cold start takes ~1 minute and, while asleep, the Telegram bot and the
# per-minute scheduler are frozen (queued Telegram updates are dropped on
# wake because polling starts with drop_pending_updates=True).
#
# Cadence: every 10 minutes — comfortably below Render's 15-minute idle
# timer. GitHub's scheduler is best-effort and can run late, so 10 < 15
# leaves headroom. If this repo is private, every run bills ~1 Actions
# minute (288/day); a free uptime monitor (UptimeRobot, cron-job.org) is
# cheaper — see DEPLOY.md.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Add the Render URL as the BACKEND_URL repository secret."
            exit 1
          fi
          # /health also exercises Supabase, so this doubles as a dependency probe.
          curl --silent --show-error --fail --max-time 55 --retry 2 "$BACKEND_URL/health"
